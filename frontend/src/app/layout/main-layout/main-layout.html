<p-toast />

@if (realtime.state() === 'reconnecting' || realtime.state() === 'disconnected') {
  <div class="bg-amber-100 px-6 py-1 text-center text-xs text-amber-900">{{ 'realtime.reconnecting' | transloco }}</div>
}

<header class="flex items-center justify-between gap-4 border-b border-gray-200 px-6 py-3">
  <div class="flex items-center gap-6">
    <span class="text-lg font-semibold">{{ 'auth.appName' | transloco }}</span>

    <nav class="flex gap-4 text-sm" aria-label="Main">
      <a
        routerLink="/"
        routerLinkActive="font-semibold text-blue-700"
        [routerLinkActiveOptions]="{ exact: true }"
        class="hover:underline"
      >
        {{ 'layout.nav.dashboard' | transloco }}
      </a>
      <a routerLink="/palette" routerLinkActive="font-semibold text-blue-700" class="hover:underline">
        {{ 'layout.nav.palette' | transloco }}
      </a>
    </nav>
  </div>

  <div class="flex items-center gap-3">
    <app-notification-bell />

    <a
      routerLink="/profile"
      routerLinkActive="bg-gray-100"
      class="flex items-center gap-2 rounded-full py-1 pr-3 pl-1 text-sm text-gray-700 hover:bg-gray-100"
      [attr.aria-label]="'profile.title' | transloco"
    >
      @if (auth.user(); as user) {
        <app-avatar [userId]="user.id" [name]="user.displayName" [version]="user.avatarVersion" [size]="28" />
        {{ user.displayName }}
      }
    </a>
  </div>
</header>

<router-outlet />
