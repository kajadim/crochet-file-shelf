<header class="flex items-center justify-between gap-4 border-b border-gray-200 px-6 py-3">
  <div class="flex items-center gap-6">
    <span class="text-lg font-semibold">Crochet File Shelf</span>

    <nav class="flex gap-4 text-sm" aria-label="Main">
      <a
        routerLink="/"
        routerLinkActive="font-semibold text-blue-700"
        [routerLinkActiveOptions]="{ exact: true }"
        class="hover:underline"
      >
        Dashboard
      </a>
      <a routerLink="/palette" routerLinkActive="font-semibold text-blue-700" class="hover:underline">Palette</a>
    </nav>
  </div>

  <div class="flex items-center gap-3">
    <span class="text-sm text-gray-600">{{ auth.user()?.displayName }}</span>
    <button mat-stroked-button type="button" (click)="auth.logout()">Log out</button>
  </div>
</header>

<router-outlet />
