<p-toast />

@if (realtime.state() === 'reconnecting' || realtime.state() === 'disconnected') {
  <div class="banner">{{ 'realtime.reconnecting' | transloco }}</div>
}

<header class="topbar">
  <div class="topbar__left">
    <span class="topbar__brand">{{ 'auth.appName' | transloco }}</span>

    <nav class="topbar__nav" aria-label="Main">
      <a
        routerLink="/"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="topbar__link"
      >
        {{ 'layout.nav.dashboard' | transloco }}
      </a>
      <a routerLink="/palette" routerLinkActive="is-active" class="topbar__link">
        {{ 'layout.nav.palette' | transloco }}
      </a>
    </nav>
  </div>

  <div class="topbar__right">
    <app-notification-bell />

    <a
      routerLink="/profile"
      routerLinkActive="is-active"
      class="topbar__profile"
      [attr.aria-label]="'profile.title' | transloco"
    >
      @if (auth.user(); as user) {
        <app-avatar [userId]="user.id" [name]="user.displayName" [version]="user.avatarVersion" [size]="28" />
        {{ user.displayName }}
      }
    </a>
  </div>
</header>

<main class="content">
  <router-outlet />
</main>
