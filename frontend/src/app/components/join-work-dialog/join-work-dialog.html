<form [formGroup]="form" (ngSubmit)="submit()" class="form-stack">
  <p class="form-hint">{{ 'sharing.joinHint' | transloco }}</p>

  @if (error()) {
    <p role="alert" class="alert alert--error">{{ error() }}</p>
  }

  <div class="field">
    <label for="join-code" class="field__label">{{ 'sharing.code' | transloco }}</label>
    <input
      pInputText
      id="join-code"
      class="join-code"
      type="text"
      formControlName="code"
      maxlength="32"
      autocomplete="off"
      placeholder="ABCD-EFGH"
    />
    @if (form.controls.code.invalid && form.controls.code.touched) {
      <small class="field__error">{{ 'sharing.codeRequired' | transloco }}</small>
    }
  </div>

  <div class="form-actions">
    <p-button [label]="'common.cancel' | transloco" type="button" [text]="true" (onClick)="dialogRef.close()" />
    <p-button [label]="'sharing.join' | transloco" type="submit" [loading]="loading()" />
  </div>
</form>
