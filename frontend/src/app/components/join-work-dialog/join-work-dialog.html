<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
  <p class="text-sm text-gray-600">{{ 'sharing.joinHint' | transloco }}</p>

  @if (error()) {
    <p class="rounded bg-red-50 px-3 py-2 text-sm text-red-800">{{ error() }}</p>
  }

  <div class="flex flex-col gap-1">
    <label for="join-code" class="text-sm text-gray-700">{{ 'sharing.code' | transloco }}</label>
    <input
      pInputText
      id="join-code"
      type="text"
      formControlName="code"
      maxlength="32"
      autocomplete="off"
      placeholder="ABCD-EFGH"
      class="w-full font-mono uppercase tracking-widest"
    />
    @if (form.controls.code.invalid && form.controls.code.touched) {
      <small class="text-red-600">{{ 'sharing.codeRequired' | transloco }}</small>
    }
  </div>

  <div class="flex justify-end gap-2">
    <p-button [label]="'common.cancel' | transloco" type="button" [text]="true" (onClick)="dialogRef.close()" />
    <p-button [label]="'sharing.join' | transloco" type="submit" [loading]="loading()" />
  </div>
</form>
