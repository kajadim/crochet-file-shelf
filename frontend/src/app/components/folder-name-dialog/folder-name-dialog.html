<form [formGroup]="form" (ngSubmit)="submit()" class="form-stack">
  @if (error()) {
    <p class="alert alert--error">{{ error() }}</p>
  }

  <div class="field">
    <label for="folder-name" class="field__label">{{ 'dialogs.folderName.label' | transloco }}</label>
    <input pInputText id="folder-name" type="text" formControlName="name" maxlength="150" />
    @if (
      (form.controls.name.hasError('required') || form.controls.name.hasError('pattern')) &&
      form.controls.name.touched
    ) {
      <small class="field__error">{{ 'common.nameRequired' | transloco }}</small>
    }
  </div>

  <div class="form-actions">
    <p-button [label]="'common.cancel' | transloco" type="button" [text]="true" (onClick)="dialogRef.close()" />
    <p-button [label]="data.submitLabel" type="submit" [loading]="loading()" />
  </div>
</form>
