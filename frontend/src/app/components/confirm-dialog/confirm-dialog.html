<div class="form-stack">
  <p>{{ data.message }}</p>

  <div class="form-actions">
    <p-button [label]="'common.cancel' | transloco" [text]="true" (onClick)="cancel()" />
    <p-button [label]="data.confirmLabel" [severity]="data.destructive ? 'danger' : 'primary'" (onClick)="confirm()" />
  </div>
</div>
