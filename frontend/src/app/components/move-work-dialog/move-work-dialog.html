<div class="flex flex-col gap-4">
  @if (error()) {
    <p class="rounded bg-red-50 px-3 py-2 text-sm text-red-800">{{ error() }}</p>
  }

  <p class="text-sm text-gray-600">Choose the destination folder.</p>

  <div class="flex flex-col gap-2">
    @for (row of data.rows; track row.folder.id) {
      <label
        class="flex items-center gap-2"
        [class.opacity-50]="row.folder.id === data.work.folderId"
        [style.margin-left.rem]="row.depth * 1.25"
      >
        <p-radiobutton
          name="destination"
          [value]="row.folder.id"
          [disabled]="row.folder.id === data.work.folderId"
          [ngModel]="selectedId()"
          (ngModelChange)="selectedId.set($event)"
        />
        {{ row.folder.name }}
        @if (row.folder.id === data.work.folderId) {
          <span class="text-xs text-gray-500">(current folder)</span>
        }
      </label>
    }
  </div>

  <div class="flex justify-end gap-2">
    <p-button label="Cancel" type="button" [text]="true" (onClick)="dialogRef.close()" />
    <p-button label="Move" type="button" [disabled]="!selectedId()" [loading]="loading()" (onClick)="submit()" />
  </div>
</div>
