<div class="form-stack">
  @if (error()) {
    <p role="alert" class="alert alert--error">{{ error() }}</p>
  }

  <p class="form-hint">{{ 'dialogs.moveWork.chooseDestination' | transloco }}</p>

  <div class="move-list">
    @for (row of data.rows; track row.folder.id) {
      <label
        class="move-option"
        [class.move-option--current]="row.folder.id === data.work.folderId"
        [style.margin-left.rem]="row.depth * 1.25"
      >
        <p-radiobutton
          name="destination"
          [value]="row.folder.id"
          [disabled]="row.folder.id === data.work.folderId"
          [ngModel]="selectedId()"
          (ngModelChange)="selectedId.set($event)"
        />
        {{ row.folder.name }}
        @if (row.folder.id === data.work.folderId) {
          <span class="move-option__tag">{{ 'common.currentFolder' | transloco }}</span>
        }
      </label>
    }
  </div>

  <div class="form-actions">
    <p-button [label]="'common.cancel' | transloco" type="button" [text]="true" (onClick)="dialogRef.close()" />
    <p-button [label]="'dialogs.moveWork.move' | transloco" type="button" [disabled]="!selectedId()" [loading]="loading()" (onClick)="submit()" />
  </div>
</div>
