<nav class="flex flex-col" aria-label="Folders">
  @for (row of rows(); track row.folder.id) {
    <div
      class="flex items-center rounded-md pr-1 hover:bg-gray-100"
      [class.bg-gray-200]="row.folder.id === selectedId()"
      [style.padding-left.rem]="row.depth"
    >
      <button
        type="button"
        class="flex h-8 w-7 shrink-0 items-center justify-center text-gray-500"
        [class.invisible]="!row.hasChildren"
        [attr.aria-label]="row.expanded ? 'Collapse folder' : 'Expand folder'"
        (click)="toggleFolder.emit(row.folder.id)"
      >
        <mat-icon class="text-lg! h-5! w-5!">{{ row.expanded ? 'expand_more' : 'chevron_right' }}</mat-icon>
      </button>

      <button
        type="button"
        class="flex min-w-0 flex-1 items-center gap-2 py-1.5 text-left"
        (click)="selectFolder.emit(row.folder.id)"
      >
        <mat-icon class="text-lg! h-5! w-5! shrink-0">{{ row.expanded ? 'folder_open' : 'folder' }}</mat-icon>
        <span class="truncate">{{ row.folder.name }}</span>
      </button>

      <button
        type="button"
        class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full text-gray-500 hover:bg-gray-200"
        aria-label="Folder actions"
        [matMenuTriggerFor]="menu"
      >
        <mat-icon class="text-lg! h-5! w-5!">more_vert</mat-icon>
      </button>

      <mat-menu #menu="matMenu">
        <button mat-menu-item type="button" (click)="createSubfolder.emit(row.folder)">
          <mat-icon>create_new_folder</mat-icon>
          <span>New subfolder</span>
        </button>
        <button mat-menu-item type="button" (click)="renameFolder.emit(row.folder)">
          <mat-icon>edit</mat-icon>
          <span>Rename</span>
        </button>
        <button mat-menu-item type="button" (click)="deleteFolder.emit(row.folder)">
          <mat-icon>delete</mat-icon>
          <span>Delete</span>
        </button>
      </mat-menu>
    </div>
  }
</nav>
