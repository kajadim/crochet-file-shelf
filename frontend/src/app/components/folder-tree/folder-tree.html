<nav class="tree" aria-label="Folders">
  @for (row of rows(); track row.kind === 'folder' ? row.folder.id : row.work.id) {
    @if (row.kind === 'folder') {
      <div class="tree__row" [class.is-selected]="row.folder.id === selectedId()" [style.padding-left.rem]="row.depth">
        <button
          type="button"
          class="tree__toggle"
          [class.is-hidden]="!row.hasChildren"
          [attr.aria-label]="row.expanded ? 'Collapse folder' : 'Expand folder'"
          (click)="toggleFolder.emit(row.folder.id)"
        >
          <i class="pi" [class.pi-chevron-down]="row.expanded" [class.pi-chevron-right]="!row.expanded"></i>
        </button>

        <button type="button" class="tree__label" (click)="selectFolder.emit(row.folder.id)">
          <i class="pi tree__icon" [class.pi-folder-open]="row.expanded" [class.pi-folder]="!row.expanded"></i>
          <span class="tree__name">{{ row.folder.name }}</span>
        </button>

        <app-action-menu [items]="menuItems(row.folder)" [ariaLabel]="folderActionsLabel" />
      </div>
    } @else {
      <div class="tree__row" [style.padding-left.rem]="row.depth">
        <span class="tree__spacer"></span>
        <button type="button" class="tree__label tree__label--work" (click)="openWork.emit(row.work)">
          <i class="pi tree__icon tree__icon--work" [class]="workIcons[row.work.type]"></i>
          <span class="tree__name">{{ row.work.name }}</span>
        </button>
      </div>
    }
  }
</nav>
