<div class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <h1 class="text-2xl font-semibold">Forgot your password?</h1>
    <p class="text-gray-500 mb-6">Enter your email and we will send you a code to reset it.</p>

    @if (error()) {
      <p class="mb-4 rounded bg-red-50 px-3 py-2 text-sm text-red-800">{{ error() }}</p>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col">
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="email" />
        @if (form.controls.email.hasError('required')) {
          <mat-error>Email is required</mat-error>
        } @else if (form.controls.email.hasError('email')) {
          <mat-error>Enter a valid email address</mat-error>
        }
      </mat-form-field>

      <button mat-flat-button type="submit" [disabled]="loading()">Send reset code</button>
    </form>

    <p class="mt-4 text-sm">
      <a routerLink="/login" class="text-blue-700 hover:underline">Back to log in</a>
    </p>
  </div>
</div>
